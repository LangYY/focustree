<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>专注树</title>
    <script>
      // 首屏引导：必须在 CSS 与 React 之前确定主题并涂好底色。
      // 否则顺序是「浏览器白底 → CSS 落地变黑 → React 设主题再变一次」，表现为闪黑。
      // 这里无法使用 tokens.css 的变量（此刻尚未加载），底色只能写字面量，
      // 取值必须与 tokens.css 的 --ft-canvas 保持一致。
      (function () {
        var DARK = '#0B0F0C'
        var LIGHT = '#F3F0E7'
        var theme = 'dark'
        try {
          // 只有深色和浅色；旧的 'system' 存量值归到深色，与 App.jsx 的读取保持一致。
          if (localStorage.getItem('ft_theme') === 'light') {
            theme = 'light'
          }
        } catch (error) {
          theme = 'dark'
        }
        var root = document.documentElement
        root.dataset.theme = theme
        root.style.backgroundColor = theme === 'light' ? LIGHT : DARK
      })()
    </script>
    <style>
      /* bundle 解析完成前 #root 是空的，给一个安静的呼吸点，避免长时间纯色空屏 */
      #root:empty::after {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: #7FBF6A;
        opacity: 0.5;
        animation: ft-boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes ft-boot-pulse {
        0%, 100% { transform: scale(0.7); opacity: 0.3; }
        50%      { transform: scale(1);   opacity: 0.7; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
